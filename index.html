<!DOCTYPE html>
<html>
  <head>
    <title>UCLA DMA Salon (online)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="UCLA DMA Salon (online)" />
    <!-- <meta property="og:description" content=""/> -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://dma.cafe" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UCLA DMA Salon (online)" />
    <!-- <meta name="twitter:description" content=""> -->
    <meta name="twitter:image" content="images/sun-grid.png" />
    <link rel="stylesheet" href="css/global.css?2020.11.12.v1" />
  </head>

  <body class="single">
    <nav id="top">
      <time class="left"> <span id="date"></span></time>
      <div class="center">
        <a href="grid.html" target="iframe"
          ><img src="images/sun-bird.png" height="16"
        /></a>
      </div>
      <div class="right">
        <!-- <span id="wait">.</span> -->
        Music <span class="on-off">( on )</span>
      </div>
    </nav>
    <div id="welcome">
      <div style="max-width: 450px">
        <img src="images/sun-bird-large.png" />
      </div>
      <br /><br />
      UCLA DMA Salon 2020–2021 (online)<br /><br /><br />
      <button id="enter">Enter</button>
    </div>

    <iframe src="grid.html" id="iframe" name="iframe"></iframe>

    <audio src="sounds/swell-ds61.mp3" id="bgm-one" loop></audio>

    <script src="js/jquery.min.js"></script>

    <script>
      $(document).ready(function (e) {
        // image maps
        // $("img[usemap]").rwdImageMaps();

        var bgm_one = document.getElementById("bgm-one");
        var playing = "no";

        $("#enter").click(function () {
          $("#welcome").fadeOut("slow");
          $("nav#top .right .on-off").html("( on )");
          setTimeout(function () {
            $("#iframe").fadeIn(1200);
            $("nav#top .right, nav#top .center").fadeIn(1200);
          }, 1500);
          setTimeout(function () {
            bgm_one.play();
            playing = "yes";
          }, 3000);
        });

        function onOff() {
          if (playing == "yes") {
            bgm_one.pause();
            $("nav#top .right .on-off").html("( off )");
            playing = "no";
          } else {
            bgm_one.play();
            $("nav#top .right .on-off").html("( on )");
            playing = "yes";
          }
        }

        $("nav#top .right .on-off").click(function () {
          onOff();
        });

        $("nav#top .left").click(function () {
          bgm_one.pause();
          playing = "no";
          $("#iframe").fadeOut(1200);
          $("nav#top .right, nav#top .center").fadeOut(1200);
          setTimeout(function () {
            $("#welcome").fadeIn("slow");
          }, 3000);
        });

        const d = new Date().toLocaleString("en-US", {
          timeZone: "America/Los_Angeles",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "numeric",
          minute: "numeric",
          timeZoneName: "short",
        });

        console.log(d);

        var date_element = document.getElementById("date");
        date_element.innerHTML = d;
      });
    </script>
  </body>
</html>
