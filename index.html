<!DOCTYPE html>

  <style>

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      background: #0F0F0F;
      color: #F0F0F0;
      font-family: monospace;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      margin: 0;
    }

    img { max-width: 100%; }

    .slide {
      padding: 30px 15% 0;
    }

    section.slide:last-of-type {
      padding-bottom: 30px;
    }

    footer {
      margin: 30px 15px 15px;
    }

    area.external {
      cursor: ne-resize;
    }

    area.progress {
      cursor: progress;
    }

    @media(max-width: 900px) {
      nav {
        display: none;
      }
      .slide {
        padding: 15px 9% 0;
      }
    }

  </style>
</head>
