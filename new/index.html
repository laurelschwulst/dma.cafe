  <body class="single">
    <nav id="top">
      <time class="left"> <span id="date"></span></time>
      <div class="center">
        <a href="grid.html" target="iframe"
          ><img src="../images/sun-bird.png" height="16"
        /></a>
      </div>
      <div class="right">
        <!-- <span id="wait">.</span> -->
        Music <span class="on-off">( on )</span>
      </div>
    </nav>
    <div id="welcome">
      <div style="max-width: 450px">
        <img src="../images/sun-bird-large.png" />
      </div>
      <br /><br />
      UCLA DMA Salon 2020–2021 (online)<br /><br /><br />
      <button id="enter">Enter</button>
    </div>

    <iframe src="grid.html" id="iframe" name="iframe"></iframe>

    <audio src="../sounds/swell-ds61.mp3" id="bgm-one" loop></audio>

    <script src="../js/jquery.min.js"></script>

    <script src="../js/date.js"></script>

    <script>
      $(document).ready(function (e) {
        // image maps
        // $("img[usemap]").rwdImageMaps();

        var bgm_one = document.getElementById("bgm-one");
        var playing = "no";

        $("#enter").click(function () {
          $("#welcome").fadeOut("slow");
          setTimeout(function () {
            $("#iframe").fadeIn(1200);
            $("nav#top .right, nav#top .center").fadeIn(1200);
          }, 1500);
          setTimeout(function () {
            bgm_one.play();
            playing = "yes";
          }, 3000);
        });

        $("nav#top .right .on-off").click(function () {
          if (playing == "yes") {
            bgm_one.pause();
            $(this).html("( off )");
            playing = "no";
            // window.clearInterval(dots);
          } else {
            bgm_one.play();
            $(this).html("( on )");
            playing = "yes";
            // window.setInterval(dots, 900);
          }
        });

        $("nav#top .left").click(function () {
          bgm_one.pause();
          playing = "no";
          $("#iframe").fadeOut(1200);
          $("nav#top .right, nav#top .center").fadeOut(1200);
          setTimeout(function () {
            $("#welcome").fadeIn("slow");
          }, 3000);
        });

        const d = new Date().toLocaleString("en-US", {
          timeZone: "America/Los_Angeles",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "numeric",
          minute: "numeric",
          timeZoneName: "short",
        });

        console.log(d);

        var date_element = document.getElementById("date");
        date_element.innerHTML = d;

        function formatAMPM(date) {
          var hours = date.getHours();
          var minutes = date.getMinutes();
          var ampm = hours >= 12 ? "pm" : "am";
          hours = hours % 12;
          hours = hours ? hours : 12; // the hour '0' should be '12'
          minutes = minutes < 10 ? "0" + minutes : minutes;
          var strTime = hours + ":" + minutes + ampm;
          return strTime;
        }

        var normal_time = formatAMPM(d);
        var time_element = document.getElementById("time");
        time_element.innerHTML = normal_time;

        // var pstTime = new Date(d.getTime() + -180 * 60 * 1000);
        // console.log(pstTime);

        //         var new_d = new Date().toLocaleDateString("en-gb", {
        //           year: "numeric",
        //           month: "long",
        //           day: "numeric",
        //           timeZone: "utc",
        //         });

        //         console.log(new_d);

        // var dots = window.setInterval(function () {
        //   var wait = document.getElementById("wait");
        //   if (wait.innerHTML.length > 2) wait.innerHTML = "";
        //   else wait.innerHTML += ".";
        // }, 900);
      });
    </script>
